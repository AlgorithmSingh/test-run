version: 1
# Issues are attempted strictly top-to-bottom.
# An entry is eligible only if every `requires` issue is in state DONE.
sequence:
  - issue: 1
    requires: []
  - issue: 2
    requires: [1]
  - issue: 3
    requires: [2]
  - issue: 4
    requires: [3]
  - issue: 5
    requires: [4]
  - issue: 6
    requires: [5]
