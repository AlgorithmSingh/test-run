repo: "AlgorithmSingh/test-run"
default_branch: "main"

selection:
  mode: "sequence"
  sequence_file: ".orchestrator/sequence.yml"

lanes:
  cloud:
    submit_cmd: 'codex cloud exec --env {env} "{prompt}"'
    status_cmd: 'codex cloud status {handle}'
    env_id: ""
    concurrency: 3
    poll_interval_sec: 30
    turn_timeout_sec: 5400
    submit_timeout_sec: 120
  founder:
    build_cmd: 'claude --dangerously-skip-permissions -p "{prompt}"'
    workdir: "/Users/ankitsingh/Documents/Workspace/projects/test-run"
    turn_timeout_sec: 5400

harness:
  isolation: "local-tmp"
  scratch_root: "/tmp/orch-harness"
  clone_from: "remote"
  render_paths: []
  render_concurrency: 1
  job_timeout_sec: 3600
  image: ""

review:
  enabled: false
  model_must_differ_from_build: true

retries:
  max_attempts: 4
  dispatch_retries: 3
  circuit_breaker_threshold: 5

merge:
  method: "squash"

toolchain_pins:
  claude_code: "2.1.x"
  codex: "0.13x"
